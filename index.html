<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Insights — 人事・HR最新レポート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

/* ── リセット & 変数 ── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#1a3a5c;--navy-mid:#1e456e;--navy-light:#2a5080;
  --accent:#c8a84b;--accent-light:#e8d08b;--accent-dim:rgba(200,168,75,0.15);
  --warm-bg:#faf9f7;--warm-card:#ffffff;--warm-border:#e8e2d8;
  --text:#1a1f2e;--text-mid:#3a4555;--text-light:#6a7a8a;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Noto Sans JP','Hiragino Sans',sans-serif;
  --display:'Cormorant Garamond',Georgia,serif;
  --cat-blue:#1a6aac;--cat-green:#1a6a3a;--cat-purple:#5a2aac;
  --cat-orange:#aa4a1a;--cat-red:#8a1a1a;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--warm-bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── ヘッダー ── */
.header{
  background:var(--navy);color:#fff;
  padding:56px 0 48px;
  position:relative;overflow:hidden;
}
.header::before{
  content:'HR';font-family:var(--serif);font-size:240px;font-weight:900;
  color:rgba(255,255,255,0.03);position:absolute;right:-20px;top:-30px;
  line-height:1;letter-spacing:-8px;pointer-events:none;user-select:none;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-light) 50%,var(--accent) 100%);
}
.header-inner{max-width:980px;margin:0 auto;padding:0 48px;position:relative;z-index:1}
.header-eyebrow{
  font-size:11px;letter-spacing:4px;color:var(--accent);
  text-transform:uppercase;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
}
.header-eyebrow::after{content:'';flex:0 0 40px;height:1px;background:var(--accent);opacity:0.5}
.header-title{
  font-family:var(--serif);font-size:52px;font-weight:900;
  line-height:1.1;margin-bottom:20px;letter-spacing:-1px;
}
.header-title-en{
  display:block;font-family:var(--display);font-style:italic;
  font-size:18px;font-weight:400;color:rgba(255,255,255,0.5);
  letter-spacing:2px;margin-bottom:8px;
}
.header-rule{
  width:48px;height:2px;background:var(--accent);margin-bottom:16px;
}
.header-desc{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.8;max-width:480px}

/* ── フィルターバー ── */
.filter-bar{
  background:var(--warm-card);border-bottom:1px solid var(--warm-border);
  position:sticky;top:0;z-index:100;
  box-shadow:0 1px 0 var(--warm-border),0 4px 16px rgba(26,35,56,0.06);
}
.filter-inner{max-width:980px;margin:0 auto;padding:0 48px}
.filter-section{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--warm-border);flex-wrap:wrap;
}
.filter-section:last-child{border-bottom:none}
.filter-label{
  font-size:10px;font-weight:700;color:var(--text-light);
  letter-spacing:1px;text-transform:uppercase;white-space:nowrap;min-width:48px;
}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;padding:4px 14px;
  border-radius:20px;font-size:11.5px;font-weight:500;cursor:pointer;
  border:1.5px solid var(--warm-border);background:var(--warm-card);
  color:var(--text-light);transition:all 0.18s;user-select:none;white-space:nowrap;
}
.chip:hover{border-color:var(--navy);color:var(--navy);background:#f0f4f8}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.chip.active.cat-採用市場     {background:var(--cat-blue);border-color:var(--cat-blue)}
.chip.active.cat-人的資本経営 {background:var(--cat-green);border-color:var(--cat-green)}
.chip.active.cat-組織開発     {background:var(--cat-purple);border-color:var(--cat-purple)}
.chip.active.cat-HR-Tech-AI   {background:var(--cat-orange);border-color:var(--cat-orange)}
.chip.active.cat-法改正・制度 {background:var(--cat-red);border-color:var(--cat-red)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
.dot-採用市場    {background:var(--cat-blue)}
.dot-人的資本経営{background:var(--cat-green)}
.dot-組織開発    {background:var(--cat-purple)}
.dot-HR-Tech-AI  {background:var(--cat-orange)}
.dot-法改正・制度{background:var(--cat-red)}

/* ── メイン ── */
.main{max-width:980px;margin:0 auto;padding:36px 48px 80px}

/* ── ヒーロー記事 ── */
.hero{
  display:block;text-decoration:none;
  background:var(--navy);border-radius:12px;overflow:hidden;
  margin-bottom:40px;position:relative;
  transition:transform 0.25s,box-shadow 0.25s;
}
.hero:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(26,35,56,0.2)}
.hero-inner{display:grid;grid-template-columns:1fr 340px;min-height:260px}
.hero-content{padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1}
.hero-eyebrow{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.hero-badge{
  background:var(--accent);color:var(--navy);
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  padding:3px 10px;border-radius:2px;text-transform:uppercase;
}
.hero-date{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.5px}
.hero-title{
  font-family:var(--serif);font-size:28px;font-weight:700;
  color:#fff;line-height:1.3;margin-bottom:14px;
  text-shadow:0 2px 16px rgba(0,0,0,0.3);
}
.hero-desc{font-size:13px;color:rgba(255,255,255,0.62);line-height:1.75;margin-bottom:20px}
.hero-cta{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--accent);font-size:12px;font-weight:700;letter-spacing:0.5px;
}
.hero-cta::after{content:'→';transition:transform 0.2s}
.hero:hover .hero-cta::after{transform:translateX(4px)}
.hero-thumb{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,#0d2840 0%,#1e4070 100%);
}
.hero-thumb-icon{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
  font-size:72px;opacity:0.6;
}
.hero-thumb-pattern{
  position:absolute;top:-40px;right:-40px;
  width:240px;height:240px;border-radius:50%;
  border:1px solid rgba(200,168,75,0.2);
}
.hero-thumb-pattern::after{
  content:'';position:absolute;top:20px;left:20px;right:20px;bottom:20px;
  border-radius:50%;border:1px solid rgba(200,168,75,0.15);
}
.hero-thumb-cat{
  position:absolute;bottom:20px;left:20px;right:20px;
  font-size:11px;color:rgba(255,255,255,0.7);letter-spacing:1px;
  font-family:var(--display);font-style:italic;
}

/* ── 結果ヘッダー ── */
.results-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--warm-border);
}
.results-label{
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-light);font-weight:700;display:flex;align-items:center;gap:10px;
}
.results-label::before{content:'';width:20px;height:1px;background:var(--accent)}
.results-count{font-size:12px;color:var(--text-light)}
.results-count strong{color:var(--text);font-weight:700}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.active-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--navy);color:#fff;font-size:11px;
  font-weight:700;border-radius:4px;padding:4px 10px;
}
.active-tag .remove{cursor:pointer;opacity:0.7;font-size:13px;line-height:1}
.active-tag .remove:hover{opacity:1}

/* ── カード一覧 ── */
.cards{display:flex;flex-direction:column;gap:12px}

/* ── カード ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card{
  background:var(--warm-card);border-radius:10px;
  border:1px solid var(--warm-border);
  padding:0;text-decoration:none;display:flex;overflow:hidden;
  transition:box-shadow 0.22s,transform 0.18s,border-color 0.18s;
  opacity:0;animation:fadeUp 0.4s ease forwards;
  position:relative;
}
.card:hover{
  box-shadow:0 8px 28px rgba(26,35,56,0.12);
  transform:translateY(-2px);border-color:rgba(200,168,75,0.4);
}
.card-accent{
  width:3px;flex-shrink:0;align-self:stretch;
}
.card[data-category="採用市場"]    .card-accent{background:var(--cat-blue)}
.card[data-category="人的資本経営"] .card-accent{background:var(--cat-green)}
.card[data-category="組織開発"]    .card-accent{background:var(--cat-purple)}
.card[data-category="HR Tech・AI"] .card-accent{background:var(--cat-orange)}
.card[data-category="法改正・制度"] .card-accent{background:var(--cat-red)}

/* ── カードサムネイル ── */
.card-thumb{
  width:148px;min-width:148px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px 14px;flex-shrink:0;
  background:linear-gradient(145deg,var(--navy) 0%,var(--navy-light) 100%);
  position:relative;overflow:hidden;
}
.card-thumb::before{
  content:'';position:absolute;top:-24px;right:-24px;
  width:96px;height:96px;border-radius:50%;
  background:rgba(200,168,75,0.1);border:1px solid rgba(200,168,75,0.15);
}
.card-thumb::after{
  content:'';position:absolute;bottom:-18px;left:-8px;
  width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,0.04);
}
.card-thumb-inner{position:relative;z-index:1}
.card-thumb-icon{font-size:20px;line-height:1;display:block;margin-bottom:6px}
.card-thumb-title{
  font-size:10.5px;font-weight:700;color:#fff;
  line-height:1.45;letter-spacing:-0.1px;
  display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.cat-thumb-採用市場    {background:linear-gradient(145deg,#0a4070 0%,#1a6aac 100%)}
.cat-thumb-人的資本経営{background:linear-gradient(145deg,#084020 0%,#1a6a3a 100%)}
.cat-thumb-組織開発    {background:linear-gradient(145deg,#300870 0%,#5a2aac 100%)}
.cat-thumb-HR-Tech-AI  {background:linear-gradient(145deg,#501808 0%,#1a3a5c 100%)}
.cat-thumb-法改正・制度{background:linear-gradient(145deg,#580808 0%,#8a1a1a 100%)}

/* ── カード本文 ── */
.card-body{flex:1;min-width:0;padding:18px 20px}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-category{
  font-size:10px;font-weight:700;letter-spacing:0.5px;
  padding:2px 9px;border-radius:2px;white-space:nowrap;text-transform:uppercase;
}
.card-category.cat-採用市場    {background:#e4f0fa;color:#0e4a7a}
.card-category.cat-人的資本経営{background:#e4f2ea;color:#0e4a22}
.card-category.cat-組織開発    {background:#eee4fa;color:#3a0a7a}
.card-category.cat-HR-Tech-AI  {background:#faf0e4;color:#7a2a08}
.card-category.cat-法改正・制度{background:#fae4e4;color:#7a0a0a}
.card-date{font-size:10.5px;color:var(--text-light)}
.card-title{
  font-size:15.5px;font-weight:700;color:var(--navy);
  line-height:1.45;margin-bottom:5px;letter-spacing:-0.2px;
  transition:color 0.15s;
}
.card:hover .card-title{color:var(--navy-mid)}
.card-subtitle{
  font-size:11.5px;color:var(--text-light);margin-bottom:0;
  line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.card-arrow{
  align-self:center;padding-right:18px;
  color:var(--warm-border);font-size:22px;flex-shrink:0;
  transition:color 0.18s,transform 0.18s;
}
.card:hover .card-arrow{color:var(--accent);transform:translateX(4px)}

/* ── 空状態 ── */
.empty{text-align:center;padding:72px 32px;color:var(--text-light)}
.empty-icon{font-size:40px;margin-bottom:16px;opacity:0.5}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty p{font-size:13px}

/* ── フッター ── */
.footer{
  text-align:center;padding:32px 24px;
  font-size:11px;color:var(--text-light);letter-spacing:0.5px;
  border-top:1px solid var(--warm-border);background:var(--warm-card);
}
.footer-brand{
  font-family:var(--serif);font-size:14px;font-weight:700;
  color:var(--navy);margin-bottom:6px;letter-spacing:1px;
}

/* ── レスポンシブ ── */
@media(max-width:768px){
  .header{padding:40px 0 36px}
  .header-inner,.filter-inner,.main{padding-left:20px;padding-right:20px}
  .header-title{font-size:36px}
  .hero-inner{grid-template-columns:1fr;min-height:auto}
  .hero-thumb{height:160px}
  .hero-content{padding:28px 24px}
  .hero-title{font-size:20px}
  .main{padding-top:24px;padding-bottom:48px}
  .card-thumb{width:110px;min-width:110px}
  .card-body{padding:14px 14px}
  .card-title{font-size:14px}
  .results-header{flex-direction:column;align-items:flex-start;gap:8px}
}
@media(max-width:480px){
  .hero-inner{display:block}
  .card-thumb{width:88px;min-width:88px}
  .card-thumb-title{-webkit-line-clamp:2}
}
</style>
</head>

];

// =============================================
// フィルター状態
// =============================================
let activeCat   = "all";
let activeMonth = "all";

// =============================================
// ユーティリティ
// =============================================
function getMonthLabel(dateStr){
  const [y,m]=dateStr.split("-");
  return `${y}年${parseInt(m)}月`;
}
function formatDate(dateStr){
  const [y,m,d]=dateStr.split("-");
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

// =============================================
// ヒーロー記事（最新1件）
// =============================================
function renderHero(){
  if(!ARTICLES.length) return;
  const a=ARTICLES[0];
  const hero=document.getElementById("hero");
  hero.href=a.file;
  hero.style.display="block";
  document.getElementById("hero-badge").textContent=a.category;
  document.getElementById("hero-date").textContent=formatDate(a.date);
  document.getElementById("hero-title").textContent=a.title;
  document.getElementById("hero-desc").textContent=a.desc;
  document.getElementById("hero-icon").textContent=ICONS[a.category]||'📄';
  document.getElementById("hero-cat").textContent=a.category;
  const thumbKey=a.category.replace(/\s/g,"").replace(/・/g,"-").replace("HRTech-AI","HR-Tech-AI");
  document.querySelector(".hero-thumb").style.background=
    getThumbGradient(thumbKey);
}
function getThumbGradient(key){
  const map={
    '採用市場':'linear-gradient(145deg,#0a4070 0%,#1a6aac 100%)',
    '人的資本経営':'linear-gradient(145deg,#084020 0%,#1a6a3a 100%)',
    '組織開発':'linear-gradient(145deg,#300870 0%,#5a2aac 100%)',
    'HR-Tech-AI':'linear-gradient(145deg,#501808 0%,#1a3a5c 100%)',
    '法改正・制度':'linear-gradient(145deg,#580808 0%,#8a1a1a 100%)'
  };
  return map[key]||'linear-gradient(145deg,#0d2840 0%,#1e4070 100%)';
}

// =============================================
// 月チップ生成
// =============================================
function buildMonthChips(){
  const months=[...new Set(ARTICLES.map(a=>getMonthLabel(a.date)))];
  months.sort((a,b)=>{
    const n=s=>{const[y,r]=s.split("年");return parseInt(y)*100+parseInt(r)};
    return n(b)-n(a);
  });
  const container=document.getElementById("month-chips");
  months.forEach(m=>{
    const chip=document.createElement("span");
    chip.className="chip";chip.dataset.month=m;chip.textContent=m;
    chip.addEventListener("click",()=>onMonthClick(chip,m));
    container.appendChild(chip);
  });
}

// =============================================
// カード描画
// =============================================
function renderCards(){
  const container=document.getElementById("cards");
  const empty=document.getElementById("empty");
  const countEl=document.getElementById("results-count");
  const activeEl=document.getElementById("active-filters");

  const filtered=ARTICLES.slice(1).filter(a=>{
    const catOk=activeCat==="all"||a.category===activeCat;
    const monthOk=activeMonth==="all"||getMonthLabel(a.date)===activeMonth;
    return catOk&&monthOk;
  });

  countEl.innerHTML=`<strong>${filtered.length}</strong> 件`;
  activeEl.innerHTML="";

  if(activeCat!=="all"){
    const tag=document.createElement("span");
    tag.className="active-tag";
    tag.innerHTML=`${activeCat} <span class="remove">✕</span>`;
    tag.querySelector(".remove").addEventListener("click",()=>{
      activeCat="all";
      document.querySelectorAll("#cat-chips .chip").forEach(c=>c.classList.remove("active"));
      document.querySelector('#cat-chips [data-cat="all"]').classList.add("active");
      renderCards();
    });
    activeEl.appendChild(tag);
  }
  if(activeMonth!=="all"){
    const tag=document.createElement("span");
    tag.className="active-tag";
    tag.innerHTML=`${activeMonth} <span class="remove">✕</span>`;
    tag.querySelector(".remove").addEventListener("click",()=>{
      activeMonth="all";
      document.querySelectorAll("#month-chips .chip").forEach(c=>c.classList.remove("active"));
      document.querySelector('#month-chips [data-month="all"]').classList.add("active");
      renderCards();
    });
    activeEl.appendChild(tag);
  }

  container.innerHTML="";
  if(filtered.length===0){empty.style.display="block";return}
  empty.style.display="none";

  filtered.forEach((a,i)=>{
    const catClass="cat-"+a.category.replace(/\s|・/g,"-").replace(/Tech/g,"Tech");
    const thumbKey=a.category.replace(/\s/g,"").replace(/・/g,"-").replace("HRTech-AI","HR-Tech-AI");
    const icon=ICONS[a.category]||'📄';

    const card=document.createElement("a");
    card.className="card";
    card.href=a.file;
    card.dataset.category=a.category;
    card.style.animationDelay=`${Math.min(i*0.04,0.4)}s`;
    card.innerHTML=`
      <div class="card-accent"></div>
      <div class="card-thumb cat-thumb-${thumbKey}">
        <div class="card-thumb-inner">
          <span class="card-thumb-icon">${icon}</span>
          <div class="card-thumb-title">${a.title}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-category ${catClass}">${a.category}</span>
          <span class="card-date">${formatDate(a.date)}</span>
        </div>
        <div class="card-title">${a.title}</div>
        <div class="card-subtitle">${a.subtitle||a.desc}</div>
      </div>
      <div class="card-arrow">›</div>
    `;
    container.appendChild(card);
  });
}

// =============================================
// イベント
// =============================================
function onCatClick(chip,cat){
  activeCat=cat;
  document.querySelectorAll("#cat-chips .chip").forEach(c=>{
    c.classList.remove("active");
    c.classList.forEach(cls=>{if(cls.startsWith("cat-"))c.classList.remove(cls)});
  });
  chip.classList.add("active");
  if(cat!=="all"){chip.classList.add("cat-"+cat.replace(/\s|・/g,"-"))}
  renderCards();
}
function onMonthClick(chip,month){
  activeMonth=month;
  document.querySelectorAll("#month-chips .chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  renderCards();
}
document.querySelectorAll("#cat-chips .chip").forEach(chip=>{
  chip.addEventListener("click",()=>onCatClick(chip,chip.dataset.cat));
});
document.querySelector('#month-chips [data-month="all"]').addEventListener("click",e=>{
  onMonthClick(e.target,"all");
});

// =============================================
// 初期化
// =============================================
renderHero();
buildMonthChips();
renderCards();
</script>
</body>
</html>
